# Publishes the parts of HALCHECK that need no server: the Core Screening App
# (browser-only engine and screens) and the public proof-bundle verifier.
#
# The Compliance Trail's live flow is deliberately absent: it needs a Fabric
# network, Postgres, MinIO and the backend API, none of which a static host can
# provide. What is published is exactly the part that proves the project's
# claim without any infrastructure at all.
name: Deploy static demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Two pages, one build (vite.config.ts): the screening app at the root,
      # the verifier at /verify/. `base: "./"` keeps the asset URLs relative so
      # the artifact works from a project subpath.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
