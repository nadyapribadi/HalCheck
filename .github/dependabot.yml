# Dependency updates (ADR-free, housekeeping): one entry per package ecosystem
# in this repository. The chaincode's vendor/ trees are committed, so a Go
# bump means re-running `go mod tidy && go mod vendor` in the module - which
# Dependabot cannot do for us; those PRs are a starting point, not a merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/backend"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/frontend"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: "/chaincode/batch"
    schedule: { interval: monthly }
    open-pull-requests-limit: 3

  - package-ecosystem: gomod
    directory: "/chaincode/refdata"
    schedule: { interval: monthly }
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
